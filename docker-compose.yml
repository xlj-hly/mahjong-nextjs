services:
  server:
    build:
      context: .
      dockerfile: docker/Dockerfile.server
    image: mahjong-server:latest
    ports:
      - '3001:3001'
    environment:
      PORT: '3001'
      NODE_ENV: production
    # 与 Dockerfile 的 HEALTHCHECK 保持一致；显式写出便于在 compose 层查看/覆盖
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:'+(process.env.PORT||3001)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    image: mahjong-web:latest
    ports:
      - '3000:3000'
    environment:
      PORT: '3000'
      NODE_ENV: production
    # Next standalone 无 /health 端点，用首页做存活探测（对应 server 的 /health）
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped
