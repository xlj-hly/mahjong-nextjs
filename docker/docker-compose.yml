# 线上部署用 compose：只 pull、不 build（配合 deploy.sh 的 `docker compose pull` + `up -d --force-recreate`）。
# 部署时把这个文件放到服务器 /opt/www/mahjong/docker-compose.yml，
# 并在同目录建 .env（参考 docker/.env.example）写入 DOCKER_USERNAME，docker compose 会自动读取。
# 同时把仓库里的 docker/nginx.conf 复制到服务器同目录的 nginx.conf（下面 nginx 服务会挂载它）。
services:
  # 唯一对外入口：按统一前缀分流（/ → web，/api/ 与 /ws/ → server）
  nginx:
    image: nginx:alpine
    depends_on:
      - server
      - web
    ports:
      - '80:80'
      # 上线启用 HTTPS 后追加：- '443:443' 并挂载证书
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  server:
    image: ${DOCKER_USERNAME}/mahjong-server:latest
    expose:
      - '3001'
    environment:
      PORT: '3001'
      NODE_ENV: production
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:'+(process.env.PORT||3001)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  web:
    image: ${DOCKER_USERNAME}/mahjong-web:latest
    expose:
      - '3000'
    environment:
      PORT: '3000'
      NODE_ENV: production
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped
